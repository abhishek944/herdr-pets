[package]
name = "herdr-pets"
version = "0.1.0"
description = "A transparent desktop village for live Herdr agents"
authors = ["herdr-pets contributors"]
edition = "2021"
rust-version = "1.88"
license = "MIT"

[lib]
name = "herdr_pets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "herdr-pets"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSWindow"] }

id = "pet-town"
name = "Pet Town"
version = "1.2.9"
min_herdr_version = "0.9.0"
description = "A transparent desktop village for live Herdr agents"
platforms = ["macos"]

[[startup]]
command = ["sh", "scripts/supervisor.sh", "startup"]

[[actions]]
id = "village-on"
title = "Show Pet Street"
contexts = ["workspace"]
command = ["sh", "scripts/supervisor.sh", "on"]

[[actions]]
id = "village-off"
title = "Hide Pet Street"
contexts = ["workspace"]
command = ["sh", "scripts/supervisor.sh", "off"]

[[actions]]
id = "village-status"
title = "Show Pet Town status"
contexts = ["workspace"]
command = ["sh", "scripts/supervisor.sh", "status"]

[[actions]]
id = "preferences"
title = "Open Pet Town preferences"
contexts = ["workspace"]
command = ["sh", "scripts/supervisor.sh", "preferences"]

[[actions]]
id = "reload-preferences"
title = "Reload Pet Town preferences"
contexts = ["workspace"]
command = ["sh", "scripts/supervisor.sh", "reload-preferences"]

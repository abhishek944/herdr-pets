<main class="content">
  <div class="top">
    <div class="brand"><img src="/onboarding/app.png" alt="" />Pet Town</div>
    <span>Make it yours</span>
  </div>
  <header class="intro">
    <h1>Choose a place to settle in.</h1>
    <p>A little scenery for the bottom of your desktop. You can change it any time.</p>
  </header>
  <div class="appearance-preview" data-theme-preview="standard" data-main-preview>
    <div class="preview-label">SAMPLE DESKTOP · <span data-theme-name>Classic</span></div>
    <div class="sample-window">
      Your workspace stays yours.
      <div class="sample-line"></div>
      <div class="sample-line" style="width: 55%"></div>
    </div>
    <img class="scene-pet" src="/onboarding/nib-walk.png" alt="Sample pet on your desktop" />
  </div>
  <div class="themes">
    <button class="theme-choice" type="button" data-theme-choice="standard" aria-pressed="true">
      <div class="swatch" data-theme-preview="standard" aria-hidden="true"></div>
      Classic</button
    ><button class="theme-choice" type="button" data-theme-choice="ocean" aria-pressed="false">
      <div class="swatch" data-theme-preview="ocean" aria-hidden="true"></div>
      Ocean</button
    ><button class="theme-choice" type="button" data-theme-choice="rainforest" aria-pressed="false">
      <div class="swatch" data-theme-preview="rainforest" aria-hidden="true"></div>
      Forest</button
    ><button class="theme-choice" type="button" data-theme-choice="snowy" aria-pressed="false">
      <div class="swatch" data-theme-preview="snowy" aria-hidden="true"></div>
      Snow</button
    ><button class="theme-choice" type="button" data-theme-choice="desert" aria-pressed="false">
      <div class="swatch" data-theme-preview="desert" aria-hidden="true"></div>
      Desert Oasis
    </button>
    <button
      class="theme-choice"
      type="button"
      data-theme-choice="rollercoaster"
      aria-pressed="false"
    >
      <div class="swatch" data-theme-preview="rollercoaster" aria-hidden="true"></div>
      Rollercoaster
    </button>
    <button class="theme-choice" type="button" data-theme-choice="goldmine" aria-pressed="false">
      <div class="swatch" data-theme-preview="goldmine" aria-hidden="true"></div>
      Gold Mine
    </button>
    <button class="theme-choice" type="button" data-theme-choice="railway" aria-pressed="false">
      <div class="swatch" data-theme-preview="railway" aria-hidden="true"></div>
      Tiny Railway
    </button>
  </div>
  <div class="next">
    <button class="secondary" type="button">‹ Back</button
    ><button class="primary" type="button">Keep this look →</button>
  </div>
  <footer class="bottom">
    <span>Classic is a quiet starting point.</span><span>You can change this later.</span>
  </footer>
</main>

# Preserve the existing trusted local desktop command surface.
[[permission]]
identifier = "allow-desktop-commands"
description = "Existing native commands for the local strip, settings and voice runtime."
commands.allow = [
  "list_adapter_setups",
  "set_adapter_enabled",
  "list_agents",
  "focus_agent",
  "trace_pet_input",
  "create_pet_draft",
  "discard_pet_draft",
  "import_pet_animation",
  "activate_pet_extension",
  "discard_pet_extension_candidate",
  "list_pet_extensions",
  "list_user_pet_packs",
  "save_pet_extension",
  "save_pet_pack",
  "cancel_orchestrator_task",
  "delegate_orchestrator_task",
  "delegate_firstmate_task",
  "cancel_firstmate_task",
  "get_orchestrator_status",
  "openai_key_source",
  "save_openai_key",
  "import_openai_key_from_shell",
  "get_orchestrator_pet_state",
  "focus_mayor",
  "set_mayor_speech",
  "set_mayor_voice_status",
  "report_orchestrator_diagnostic",
  "report_orchestrator_error",
  "list_orchestrator_workspaces",
  "set_orchestrator_listening",
  "set_firstmate_talk",
  "firstmate_talk_active",
  "begin_firstmate_listening",
  "firstmate_phase",
  "set_firstmate_phase",
  "firstmate_voice_ready",
  "start_firstmate",
  "firstmate_agent_status",
  "send_firstmate_text",
  "poll_firstmate_replies",
  "acknowledge_firstmate_reply",
  "latest_firstmate_reply",
  "transcribe_firstmate_audio",
  "speak_firstmate_text",
  "play_firstmate_audio",
  "stop_firstmate_audio",
  "start_orchestrator_session",
  "rearm_orchestrator_voice",
  "stop_orchestrator_session",
  "apply_preferences",
  "get_preferences",
  "reload_preferences",
  "get_settings_context",
  "is_settings_open",
  "open_preferences",
  "show_settings",
  "open_3d_town",
  "quit_pet_town",
  "set_hit_regions",
  "renderer_ready",
  "street_assignment",
  "set_village_visible",
  "village_visible",
]

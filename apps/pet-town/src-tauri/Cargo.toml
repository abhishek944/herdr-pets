[package]
name = "pet-town"
version = "1.2.9"
description = "A transparent desktop village for live Herdr agents"
authors = ["pet-town contributors"]
edition = "2021"
rust-version = "1.88"
license = "MIT"

[lib]
name = "pet_town_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pet-town"
path = "src/main.rs"

[build-dependencies]
flate2 = "1"
tar = "0.4"
serde_json = "1"
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
futures-util = "0.3"
pet-town-agent-broker = { path = "../../../packages/pet-town-agent-broker" }
# custom-protocol makes every build serve the embedded frontend through Tauri's
# asset protocol. Without it Tauri assumes a development environment and every
# window (including release binaries) loads from the vite dev server instead,
# so the packaged app renders blank windows unless that server is running.
# Note: `tauri dev` then serves embedded assets too, so rebuild to refresh it.
tauri = { version = "2", features = ["macos-private-api", "custom-protocol", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
fs2 = "0.4"
wait-timeout = "0.2"
base64 = "0.22"
crc32fast = "1"
flate2 = "1"
hex = "0.4"
tar = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
plist = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSRunningApplication", "NSWindow"] }
tauri-nspanel = "2.1"
security-framework = "3"

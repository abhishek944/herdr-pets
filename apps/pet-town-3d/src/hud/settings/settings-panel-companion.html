<div
  id="town-panel-companion"
  role="tabpanel"
  aria-labelledby="town-tab-companion"
  data-panel="companion"
>
  <div data-companion-profile>
    <div class="profile">
      <span data-field="portrait"></span>
      <div class="profile-name">
        <h2 data-field="name">Choose a companion</h2>
        <p data-field="following">Pick someone from the list.</p>
      </div>
      <select data-control="companion" aria-label="Selected companion">
        <option value="">Choose a companion</option>
      </select>
    </div>
    <div class="appearance-row">
      <div>
        <h3>Your pet</h3>
        <p data-field="appearance">Choose a companion to change its pet.</p>
      </div>
      <button type="button" data-control="change-pet">Change pet</button>
    </div>
    <div class="control-grid">
      <section class="control-tile">
        <h3>Companion control</h3>
        <p data-field="controlHint">Follow a companion to walk and jump.</p>
        <button type="button" class="action" data-control="control">
          <span>Control</span> <kbd>C</kbd>
        </button>
      </section>
      <section class="control-tile">
        <h3>Camera view</h3>
        <p>Choose how you see the town.</p>
        <div class="camera-choices">
          <button type="button" data-control="third">Third person</button
          ><button type="button" data-control="first">First person <kbd>V</kbd></button>
        </div>
      </section>
    </div>
    <div class="profile-actions">
      <button type="button" data-control="focus">Open agent ↗</button
      ><button type="button" class="leave" data-control="leave">
        Leave companion <kbd>Esc</kbd>
      </button>
    </div>
    <p class="note" data-field="remoteHint" hidden></p>
    <p class="settings-feedback" data-field="feedback" role="status" hidden></p>
    <p class="note">
      Close this panel to return to the town. Your Mayor conversation stays connected.
    </p>
  </div>
  <div data-pet-gallery hidden></div>
</div>
